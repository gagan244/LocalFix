<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Service Request - LocalFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">LocalFix Tracker</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/track">Track Status</a>
                <a class="nav-link btn btn-outline-light btn-sm ms-2" href="/owner/login">Owner Login</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0 fw-bold">Customer Service Request Form</h4>
                        <small>Enter your contact, device, and problem details</small>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/create-request}" th:object="${serviceRequest}" method="post">
                            
                            <h5 class="fw-bold mb-3 text-secondary border-bottom pb-2">1. Customer Information</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Full Name *</label>
                                    <input type="text" th:field="*{customerName}" class="form-control" placeholder="e.g. John Sharma" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Phone Number *</label>
                                    <input type="tel" th:field="*{customerPhone}" class="form-control" placeholder="e.g. 9876543210" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Email Address</label>
                                    <input type="email" th:field="*{customerEmail}" class="form-control" placeholder="john@example.com">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Service Address *</label>
                                    <input type="text" th:field="*{serviceAddress}" class="form-control" placeholder="House/Flat No, Area" required>
                                </div>
                            </div>

                            <h5 class="fw-bold mb-3 text-secondary border-bottom pb-2">2. Device & Problem Details</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Device Type *</label>
                                    <select th:field="*{deviceType}" class="form-select" required>
                                        <option value="Laptop">Laptop / PC</option>
                                        <option value="Smartphone">Smartphone / Tablet</option>
                                        <option value="AC">AC / Air Conditioner</option>
                                        <option value="Refrigerator">Refrigerator</option>
                                        <option value="Washing Machine">Washing Machine</option>
                                        <option value="Television">Television / Smart TV</option>
                                        <option value="Other">Other Home Appliance</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Brand & Model *</label>
                                    <input type="text" th:field="*{brandModel}" class="form-control" placeholder="e.g. HP Pavilion / LG 1.5T" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Problem Description *</label>
                                    <textarea th:field="*{problemDescription}" rows="3" class="form-control" placeholder="Describe the fault, symptoms, or error codes..." required></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Priority</label>
                                    <select th:field="*{priority}" class="form-select">
                                        <option value="LOW">Low (Flexible)</option>
                                        <option value="MEDIUM" selected>Medium (Standard)</option>
                                        <option value="HIGH">High (Urgent)</option>
                                        <option value="EMERGENCY">Emergency (Immediate)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-2">
                                <a href="/" class="btn btn-outline-secondary">Back to Home</a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">Submit Service Request</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
