<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - LocalFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center mt-4">
            <div class="col-md-5 col-lg-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark">LocalFix Tracker</h3>
                    <p class="text-secondary">Owner & Technician Management Portal</p>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div th:if="${errorMessage}" class="alert alert-danger py-2 text-center" role="alert">
                            <small th:text="${errorMessage}"></small>
                        </div>

                        <form th:action="@{/owner/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" name="username" class="form-control" value="owner" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" name="password" class="form-control" value="password123" required>
                                <small class="text-muted">Default: <code>owner / password123</code></small>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 fw-semibold py-2 mt-2">Log In as Owner</button>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none text-muted">&larr; Back to Customer Portal</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
