<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Request Status - LocalFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">LocalFix Tracker</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/create-request">New Request</a>
                <a class="nav-link btn btn-outline-light btn-sm ms-2" href="/owner/login">Owner Login</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">

                <!-- Alert on New Request creation -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong th:text="${successMessage}"></strong>
                </div>

                <!-- Alert on Not Found -->
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                    <span th:text="${errorMessage}"></span>
                </div>

                <!-- Tracking Search Card -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-3">Track Service Request</h4>
                        <form th:action="@{/track}" method="get" class="d-flex gap-2">
                            <input type="text" name="id" th:value="${searchId}" class="form-control" placeholder="Enter Request ID (e.g. REQ-1001)" required>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">Track</button>
                        </form>
                    </div>
                </div>

                <!-- Found Request Details -->
                <div th:if="${foundRequest}" class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
                        <h5 class="mb-0 fw-bold">
                            Request <span class="text-primary font-monospace" th:text="${foundRequest.requestId}"></span>
                        </h5>
                        <span class="badge fs-6" 
                              th:classappend="${foundRequest.status.name() == 'COMPLETED' ? 'bg-success' : (foundRequest.status.name() == 'IN_PROGRESS' ? 'bg-primary' : (foundRequest.status.name() == 'ASSIGNED' ? 'bg-info text-dark' : 'bg-warning text-dark'))}"
                              th:text="${foundRequest.status}">
                        </span>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <small class="text-muted d-block">Device / Model</small>
                                <strong th:text="${foundRequest.deviceType} + ' - ' + ${foundRequest.brandModel}"></strong>
                            </div>
                            <div class="col-sm-6">
                                <small class="text-muted d-block">Customer Name</small>
                                <span th:text="${foundRequest.customerName}"></span>
                            </div>
                            <div class="col-sm-6">
                                <small class="text-muted d-block">Service Address</small>
                                <span th:text="${foundRequest.serviceAddress}"></span>
                            </div>
                            <div class="col-sm-6">
                                <small class="text-muted d-block">Assigned Technician</small>
                                <span th:if="${foundRequest.technician != null}" th:text="${foundRequest.technician.name} + ' (' + ${foundRequest.technician.phone} + ')'" class="text-primary fw-semibold"></span>
                                <span th:if="${foundRequest.technician == null}" class="text-muted fst-italic">Awaiting technician assignment</span>
                            </div>
                        </div>

                        <div class="p-3 bg-light rounded mb-3">
                            <small class="text-muted d-block fw-bold">Reported Problem:</small>
                            <p class="mb-0 text-secondary" th:text="${foundRequest.problemDescription}"></p>
                        </div>

                        <div class="row g-2 border-top pt-3">
                            <div class="col-6">
                                <small class="text-muted d-block">Estimated Cost</small>
                                <h5 class="text-dark fw-bold mb-0" th:text="'$' + ${#numbers.formatDecimal(foundRequest.estimatedCost, 1, 2)}"></h5>
                            </div>
                            <div class="col-6" th:if="${foundRequest.actualCost != null}">
                                <small class="text-muted d-block">Final Actual Cost</small>
                                <h5 class="text-success fw-bold mb-0" th:text="'$' + ${#numbers.formatDecimal(foundRequest.actualCost, 1, 2)}"></h5>
                            </div>
                        </div>

                        <div th:if="${foundRequest.resolutionNotes}" class="mt-3 p-3 bg-success-subtle text-success-emphasis rounded">
                            <small class="fw-bold d-block">Technician Resolution Remarks:</small>
                            <span th:text="${foundRequest.resolutionNotes}"></span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
