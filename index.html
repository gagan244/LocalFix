<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket connection warnings in sandboxed preview iframe
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason?.message).includes('WebSocket'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(e) {
        if (e && (String(e.message).includes('WebSocket') || String(e.error).includes('WebSocket'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalFix - Service Request & Technician Management</title>
    <meta name="description" content="Full-stack application for managing customer service requests, technician assignments, request status, and estimated service costs." />
    <meta property="og:title" content="LocalFix - Service Request & Technician Management" />
    <meta property="og:description" content="Full-stack application for managing customer service requests, technician assignments, request status, and estimated service costs." />
    <link rel="preconnect" href="https://fonts.googleapis.com">

  </head>

  </body>
</html>
